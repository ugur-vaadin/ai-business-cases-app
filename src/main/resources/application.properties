# Which dataset pack to run; its files live under src/main/resources/data/<pack>/.
app.pack=${APP_PACK:nordic_supply}

server.port=${PORT:8080}
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin
logging.level.org.atmosphere=warn

# JPA over the pack's schema: Hibernate never creates or alters tables; Flyway owns the app's own tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration
# the pack's schema is already in PUBLIC when Flyway starts, so it has to baseline; version 0 keeps V1 and V2 pending
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# The model. The key comes from the environment; the placeholder keeps the app starting without one
# (every AI turn then fails with a clear message instead of the app refusing to boot).
spring.ai.openai.api-key=${OPENAI_API_KEY:missing-key}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-5.6-luna}
spring.ai.openai.chat.options.temperature=0.2
# GPT-5.6 models reason by default; the chat-completions endpoint only allows function tools with reasoning off.
spring.ai.openai.chat.options.reasoning-effort=none
# Local model through an OpenAI-compatible endpoint (Ollama, LM Studio): run with --spring.profiles.active=local
